<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE4D6" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EAE6F8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F4F4E7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky soft aura -->
  <rect width="640" height="460" fill="url(#skyGrad)" rx="24"/>

  <!-- Pastel Clouds with stipple-like soft contours -->
  <g fill="#FFFFFF" fill-opacity="0.75">
    <path d="M60 360 C 40 330, 80 290, 130 300 C 150 260, 220 250, 250 290 C 290 280, 340 310, 330 360 Z"/>
    <path d="M340 240 C 320 210, 370 170, 420 180 C 450 140, 520 140, 550 180 C 590 170, 630 210, 610 250 Z" fill-opacity="0.6"/>
    <path d="M180 180 C 160 160, 190 130, 220 140 C 240 110, 290 110, 310 140 C 340 130, 370 160, 350 190 Z" fill-opacity="0.5"/>
  </g>

  <!-- Dotted Trajectory Arc with Milestone Nodes -->
  <path d="M 50 380 Q 220 340, 310 230 T 490 110" fill="none" stroke="#263B52" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>

  <!-- Milestone Nodes & Tags -->
  <!-- Node 1: Trainee -->
  <g transform="translate(90, 365)">
    <circle cx="0" cy="0" r="5" fill="#F4F4E7" stroke="#263B52" stroke-width="2"/>
    <rect x="-30" y="10" width="60" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#263B52" text-anchor="middle">TRAINEE</text>
  </g>

  <!-- Node 2: Skill Certified -->
  <g transform="translate(200, 320)">
    <circle cx="0" cy="0" r="5" fill="#F3E8A8" stroke="#263B52" stroke-width="2"/>
    <rect x="-24" y="10" width="48" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#263B52" text-anchor="middle">SKILL</text>
  </g>

  <!-- Node 3: Job Placed -->
  <g transform="translate(300, 235)">
    <circle cx="0" cy="0" r="5" fill="#C8C4F2" stroke="#263B52" stroke-width="2"/>
    <rect x="-20" y="10" width="40" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#263B52" text-anchor="middle">JOB</text>
  </g>

  <!-- Node 4: Outcome Verified -->
  <g transform="translate(390, 165)">
    <circle cx="0" cy="0" r="5" fill="#F2C8B4" stroke="#263B52" stroke-width="2"/>
    <rect x="-32" y="10" width="64" height="18" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#263B52" text-anchor="middle">OUTCOME</text>
  </g>

  <!-- Node 5: Progression -->
  <g transform="translate(490, 110)">
    <circle cx="0" cy="0" r="6" fill="#263B52" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="-38" y="-28" width="76" height="18" rx="4" fill="#263B52"/>
    <text x="0" y="-16" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#F4F4E7" text-anchor="middle">PROGRESSION</text>
  </g>

  <!-- Origami Paper Plane folded from a Certificate -->
  <g transform="translate(480, 85) rotate(-22)">
    <!-- Plane Left Wing / Certificate Body -->
    <polygon points="0,0 85,-40 25,15" fill="#FBF8EE" stroke="#263B52" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Fold crease & certificate stamp seal -->
    <polygon points="0,0 85,-40 55,-6" fill="#F5EFE0" stroke="#263B52" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Plane Right Under-Wing -->
    <polygon points="25,15 85,-40 40,28" fill="#E8DEC8" stroke="#263B52" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Gold Emblem stamp printed on paper plane wing -->
    <circle cx="45" cy="-12" r="7" fill="#F3E8A8" stroke="#263B52" stroke-width="1"/>
    <path d="M 45 -16 L 46 -13 L 49 -13 L 47 -11 L 48 -8 L 45 -10 L 42 -8 L 43 -11 L 41 -13 L 44 -13 Z" fill="#263B52"/>
    <!-- Certificate micro-lines -->
    <line x1="20" y1="-8" x2="35" y2="-12" stroke="#263B52" stroke-width="0.8" stroke-dasharray="1 1.5"/>
    <line x1="22" y1="-4" x2="37" y2="-8" stroke="#263B52" stroke-width="0.8" stroke-dasharray="1 1.5"/>
  </g>

  <!-- Updraft Speed Lines & Sparkles -->
  <path d="M430 115 C 450 105, 470 100, 500 95" fill="none" stroke="#F2C8B4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="560" cy="70" r="3" fill="#F2C8B4"/>
  <circle cx="585" cy="110" r="2" fill="#C8C4F2"/>
  <circle cx="120" cy="240" r="2" fill="#F3E8A8"/>
</svg>
